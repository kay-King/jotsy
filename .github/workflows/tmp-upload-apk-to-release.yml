name: tmp-upload-apk-to-release
on:
  workflow_dispatch:
jobs:
  upload-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download jotsy-apk artifact from run 41283167674
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 41283167674 --name jotsy-apk --dir apk-artifact --repo kay-King/jotsy
          ls -la apk-artifact
      - name: Rename APK and upload to release theme-v0.10.0-v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(find apk-artifact -name '*.apk' | head -n 1)
          echo "APK found: $apk"
          test -n "$apk"
          cp "$apk" jotsy-0.10.0-arm64.apk
          ls -la jotsy-0.10.0-arm64.apk
          gh release upload theme-v0.10.0-v1 jotsy-0.10.0-arm64.apk --clobber --repo kay-King/jotsy
