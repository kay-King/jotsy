name: upload-v0100-apk (temporary)

# 临时工作流：上传真正的 0.10.0 APK 到 Release theme-v0.10.0-v1。
# 产物：artifact 13081609979（run 41302279199，commit e78b994b，pubspec 0.10.0+22）。
# ZIP: 35,106,419 字节，sha256 5f663e2ecc4b7948ad38c1330807572aa48c1798ee5f64d1344fe4b6acd207cb。
# 铁律：必须从 APK manifest 里读出 versionName=0.10.0 才上传。用完即删。

on:
  push:
    paths:
      - '.github/workflows/upload-v0100-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact ZIP and verify hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/kay-King/jotsy/actions/artifacts/13081609979/zip" \
            -o jotsy-apk.zip
          echo "5f663e2ecc4b7948ad38c1330807572aa48c1798ee5f64d1344fe4b6acd207cb  jotsy-apk.zip" | sha256sum -c -
          echo "ZIP hash verified"

      - name: Extract APK and verify versionName from manifest
        run: |
          set -e
          unzip -o jotsy-apk.zip -d apk-out
          APK=$(find apk-out -name '*.apk' | head -1)
          cp "$APK" jotsy-0.10.0-arm64.apk
          ls -lh jotsy-0.10.0-arm64.apk
          unzip -p jotsy-0.10.0-arm64.apk AndroidManifest.xml | strings -e l | grep -q "^0\.10\.0$" || { echo "versionName NOT 0.10.0, aborting"; exit 1; }
          echo "versionName=0.10.0 verified from APK manifest"

      - name: Upload to Release (overwrite wrong asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload theme-v0.10.0-v1 jotsy-0.10.0-arm64.apk --clobber --repo kay-King/jotsy
          echo "UPLOADED"
