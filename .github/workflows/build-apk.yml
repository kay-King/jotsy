name: Build APK (fork)

# 手动触发的单文件 APK 构建：用 fork 自己的签名密钥（仓库 Secrets
# JOTSY_KEYSTORE_BASE64 / JOTSY_KEYSTORE_PASSWORD），产出 universal APK
# 作为 workflow artifact 下载。不依赖上游发布流程的签名与运行时密钥，
# 高德/和风天气的 key 留空（定位与天气功能不可用，其余功能不受影响）。

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build universal release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JOTSY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JOTSY_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing secret JOTSY_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing secret JOTSY_KEYSTORE_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jotsy-sign.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/jotsy-sign.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=jotsy\n'
            printf 'keyPassword=%s\n' "$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build arm64 APK
        run: flutter build apk --release --target-platform android-arm64

      # 每个 APK 必须同时带 v1 / v2 / v3 签名：鸿蒙与部分华为安装器只认 v1 证书，
      # 缺了就报“该安装包未包含任何证书”（签名方案见 android/app/build.gradle.kts）。
      # apksigner 只在 minSdk < 24 时才检查 v1，minSdk 24 的包默认总报 v1 false，
      # 所以用 --min-sdk-version 23 强制校验。（上游 PR #207 的校验步骤按 fork
      # 单包路径改写，2026-11-09）
      - name: Verify APK signature schemes
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          # 完全没有 v1 签名时 apksigner 在这里就失败（Missing META-INF/MANIFEST.MF）。
          if ! report="$("$apksigner" verify --verbose --min-sdk-version 23 "$apk")"; then
            echo "::error::$apk failed apksigner verify"
            exit 1
          fi
          for scheme in 'v1 scheme (JAR signing)' 'v2 scheme (APK Signature Scheme v2)' 'v3 scheme (APK Signature Scheme v3)'; do
            if ! grep -Fqx "Verified using ${scheme}: true" <<< "$report"; then
              echo "::error::$apk is not signed with ${scheme}"
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jotsy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
