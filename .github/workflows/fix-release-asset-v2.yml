name: fix-release-asset-v2 (temporary)

# 临时工作流：把 Release theme-v0.10.0-v1 里的错包（52MB）换成已核验的正确构建产物。
# 正确产物：artifact 13073598593（run 41283167674 的 jotsy-apk），ZIP 为 35106442 字节，
# SHA256=64ad197d33587d9b1c740327a2ad0216ee92f1e68044ba96ee2ee52d2c995452。
# 先验 ZIP 哈希（GitHub API 元数据即 ZIP 的），再解压上传其中的 APK。用完即删。

on:
  push:
    paths:
      - '.github/workflows/fix-release-asset-v2.yml'

permissions:
  contents: write
  actions: read

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact ZIP and verify hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/kay-King/jotsy/actions/artifacts/13073598593/zip" \
            -o jotsy-apk.zip
          ls -l jotsy-apk.zip
          SIZE=$(stat -c%s jotsy-apk.zip)
          echo "zip size=$SIZE"
          if [ "$SIZE" != "35106442" ]; then echo "SIZE MISMATCH: $SIZE"; exit 1; fi
          echo "64ad197d33587d9b1c740327a2ad0216ee92f1e68044ba96ee2ee52d2c995452  jotsy-apk.zip" | sha256sum -c -
          echo "ZIP VERIFIED OK"

      - name: Extract APK and upload to release (overwrite wrong asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          unzip -o jotsy-apk.zip -d apk-out
          APK=$(find apk-out -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "No APK found in ZIP"; exit 1; fi
          echo "Found APK: $APK"
          ls -lh "$APK"
          cp "$APK" jotsy-0.10.0-arm64.apk
          gh release upload theme-v0.10.0-v1 jotsy-0.10.0-arm64.apk --clobber
          echo "UPLOADED"
